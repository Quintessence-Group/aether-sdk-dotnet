name: Release

# Publishes AetherDb.Sdk to NuGet.org using NuGet Trusted Publishing (OIDC).
# No long-lived API key is stored: the workflow exchanges a short-lived GitHub
# OIDC token for a temporary NuGet key at publish time.
#
# Trigger:  git tag v0.1.0 && git push origin v0.1.0   (or run manually)
#
# Matches the nuget.org "deploy" trusted-publishing policy:
#   owner: aether-ai · repo: Quintessence-Group/aether-sdk-dotnet
#   workflow: release.yml · environment: prod
#
# Requires one repo secret:
#   NUGET_USER = your nuget.org username (profile name, NOT an email address)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing v<version> tag to publish or verify"
        type: string
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: Build, test & publish to NuGet
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 75
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    permissions:
      contents: read
      id-token: write # required for the NuGet Trusted Publishing OIDC exchange
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Build (Release)
        run: dotnet build -c Release

      - name: Test
        run: dotnet test -c Release --no-build

      - name: Verify release tag matches package version
        shell: bash
        run: |
          version=$(sed -n 's/.*<Version>\([^<]*\)<\/Version>.*/\1/p' src/Aether.Sdk/Aether.Sdk.csproj)
          [[ "$RELEASE_TAG" == v* ]] || { echo "::error::Select an existing v<version> release tag"; exit 1; }
          test "$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")" = "$(git rev-parse HEAD)"
          test "${RELEASE_TAG#v}" = "$version"

      - name: Pack
        run: |
          dotnet pack src/Aether.Sdk/Aether.Sdk.csproj -c Release -o ./artifacts
          dotnet pack src/Aether.Sdk.SemanticKernel/Aether.Sdk.SemanticKernel.csproj -c Release -o ./artifacts

      - name: NuGet login (OIDC → short-lived key)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        run: >
          dotnet nuget push "./artifacts/*.nupkg"
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Verify published core and Semantic Kernel packages
        shell: bash
        run: |
          version=$(sed -n 's/.*<Version>\([^<]*\)<\/Version>.*/\1/p' src/Aether.Sdk/Aether.Sdk.csproj)
          dotnet new console -o "$RUNNER_TEMP/sdk-smoke" --framework net8.0 --no-restore
          dotnet add "$RUNNER_TEMP/sdk-smoke" package AetherDb.Sdk --version "$version" --no-restore
          dotnet add "$RUNNER_TEMP/sdk-smoke" package AetherDb.Sdk.SemanticKernel --version "$version" --no-restore
          # NuGet validation and indexing can take up to an hour. Avoid cached
          # pre-publication metadata and verify both packages in an isolated cache.
          for attempt in $(seq 1 120); do
            if dotnet restore "$RUNNER_TEMP/sdk-smoke" --force --no-cache \
              --packages "$RUNNER_TEMP/nuget-release-verify" \
              --source https://api.nuget.org/v3/index.json; then
              dotnet build "$RUNNER_TEMP/sdk-smoke" --no-restore
              exit 0
            fi
            echo "Waiting for NuGet validation/indexing (attempt $attempt/120)."
            [ "$attempt" = "120" ] && exit 1
            sleep 30
          done
